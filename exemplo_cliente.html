<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integração Cliente - API AIDA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .file-name {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Section */
        .results {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }

        .badge-real {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-ia {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-inconclusivo {
            background-color: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .metric-value {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .disclaimer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .error-message {
            display: none;
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Verificador de Autenticidade</h1>
            <p>Integração B2B simulando o site de um cliente</p>
        </div>

        <div class="upload-area" id="drop-area">
            <div class="upload-icon">📷</div>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Clique ou arraste uma imagem aqui</p>
            <input type="file" id="fileInput" accept="image/*">
            <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
        </div>

        <button class="btn" id="analyzeBtn" disabled>
            <span id="btnText">Analisar Imagem</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="error-message" id="errorMessage"></div>

        <div class="results" id="resultsArea">
            <div style="text-align: center;">
                <div class="result-badge" id="resultBadge">REAL</div>
            </div>

            <div class="metric">
                <span class="metric-label">Probabilidade de ser IA</span>
                <span class="metric-value" id="probIA">0%</span>
            </div>

            <div class="metric">
                <span class="metric-label">Confiança da Análise</span>
                <span class="metric-value" id="confidence" style="text-transform: capitalize;">Alta</span>
            </div>

            <p class="disclaimer" id="disclaimerText"></p>
        </div>
    </div>

    <script>
        // Configurações da API
        const API_URL = "https://aidaon-aida-borda-api.hf.space/v1/analyze/image";
        const API_KEY = "aida_teste"; // Em um site real, essa requisição seria feita pelo Backend do cliente, para não expor a chave no JS.

        // Elementos da UI
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsArea = document.getElementById('resultsArea');
        const resultBadge = document.getElementById('resultBadge');
        const probIA = document.getElementById('probIA');
        const confidenceDisplay = document.getElementById('confidence');
        const disclaimerText = document.getElementById('disclaimerText');
        const errorMessage = document.getElementById('errorMessage');

        let selectedFile = null;

        // Mostrar nome do arquivo ao selecionar
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                analyzeBtn.disabled = false;
                resultsArea.style.display = 'none';
                errorMessage.style.display = 'none';
            }
        });

        // Fazer a requisição
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Mudar UI para estado de carregamento
            btnText.style.display = 'none';
            loader.style.display = 'block';
            analyzeBtn.disabled = true;
            resultsArea.style.display = 'none';
            errorMessage.style.display = 'none';

            // Preparar o Form-Data
            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('evidence', 'false'); // Não precisamos do mapa visual aqui

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erro ao processar imagem.');
                }

                mostrarResultados(data);

            } catch (error) {
                errorMessage.textContent = "Erro de conexão: " + error.message;
                errorMessage.style.display = 'block';
            } finally {
                // Voltar botão ao normal
                btnText.style.display = 'block';
                loader.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });

        function mostrarResultados(data) {
            // Configurar Badge Principal
            resultBadge.textContent = data.result;
            resultBadge.className = 'result-badge'; // reset
            
            if (data.result === 'REAL') {
                resultBadge.classList.add('badge-real');
            } else if (data.result === 'IA/MANIPULADA') {
                resultBadge.classList.add('badge-ia');
            } else {
                resultBadge.classList.add('badge-inconclusivo');
            }

            // Converter probabilidade de float (0.075) para % (7.5%)
            const porcentagemIA = (data.ai_probability * 100).toFixed(1) + '%';
            probIA.textContent = porcentagemIA;

            // Confiança
            confidenceDisplay.textContent = data.confidence;

            // Aviso Legal
            disclaimerText.textContent = data.disclaimer;

            // Exibir a div
            resultsArea.style.display = 'block';
        }
    </script>
</body>
</html>
